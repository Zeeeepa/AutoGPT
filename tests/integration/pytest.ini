[tool:pytest]
# Pytest configuration for chat proxy integration tests

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: Integration tests
    real_services: Tests requiring real external services
    slow: Slow running tests
    unit: Unit tests (no external dependencies)

# Async support
asyncio_mode = auto

# Output options
addopts = 
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Minimum version
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:stagehand.*
    ignore::UserWarning:openai.*
